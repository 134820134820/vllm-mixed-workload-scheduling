# Short requests stuck behind long ones, two ways (e1, e3):
#   between steps -- the engine queue is strict FCFS: a long prompt at its
#                    head that does not fit the KV cache blocks everyone;
#   within a step -- a running long prefill takes the whole token budget,
#                    so a newly arrived short waits for its chunks to finish.
# Framework knobs vs the admission gateway, alone and combined, on the e1/e3
# mixed workload under open-loop arrivals up to past capacity (~6.2 req/s).
name = "e4_admission"
seed = 0
loads = [
  { rate = 3.0, requests = 480 },
  { rate = 4.5, requests = 480 },
  { rate = 6.0, requests = 480 },
  { rate = 7.5, requests = 480 },
]

[server]
args = ["--max-model-len", "16384", "--disable-uvicorn-access-log"]

[[variant]]
name = "fcfs"

[[variant]]
name = "lpt512"            # framework: cap a long prompt's chunk per step
args = ["--long-prefill-token-threshold", "512"]

[[variant]]
name = "vllm_priority"     # framework: priority queue, priority = prompt length
args = ["--scheduling-policy", "priority"]
priority = true

[[variant]]
name = "gw_fifo"           # gateway, KV-budget admission in arrival order
gateway = ["--aging", "1e9"]

[[variant]]
name = "gw_sjf"            # gateway, shortest first with aging
gateway = ["--aging", "1000"]

[[variant]]
name = "gw_sjf_lpt512"     # gateway order + framework in-step sharing
args = ["--long-prefill-token-threshold", "512"]
gateway = ["--aging", "1000"]

[[workload]]
name = "mixed"
classes = [
  { name = "short", input = [192, 320], output = [96, 160], weight = 0.85 },
  { name = "long_input", input = [6144, 8192], output = [96, 160], weight = 0.15 },
]
